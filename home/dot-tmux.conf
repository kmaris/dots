#unbind C-b
#set -g prefix C-a
# Let's give C-Space a shot
unbind C-b
set -g prefix C-Space
set -g prefix2 C-@
bind C-Space send-prefix
bind C-@ send-prefix

set -g mouse on
#setw -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g status-keys vi
setw -g mode-keys vi

# For sesh
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session
bind -N "last-session (via sesh) " L run-shell "sesh last"
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️   )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind s split-window -p 20 -v -c '#{pane_current_path}'
bind v split-window -p 35 -h -c '#{pane_current_path}'
bind j split-window -p 20 -fv -c '#{pane_current_path}'
bind k split-window -p 20 -bfv -c '#{pane_current_path}'
bind l split-window -p 35 -fh -c '#{pane_current_path}'
bind h split-window -p 35 -bfh -c '#{pane_current_path}'

bind c new-window -c '#{pane_current_path}'
bind -n C-Tab select-window -n
bind -n C-BTab select-window -p
bind < resize-pane -L 6
bind > resize-pane -R 6
bind - resize-pane -D 3
bind + resize-pane -U 3
bind R source-file ~/.tmux.conf

# Global options
set -g status-keys vi
set -g base-index 1
set -g renumber-windows on

# Window options
set -g set-titles on
set -g set-titles-string "#T"
setw -g mode-keys vi
setw -g aggressive-resize on
setw -g pane-base-index 1
setw -g automatic-rename on
setw -g allow-rename off

# Status Bar theme (uses powershell fonts)
set -g status-position top

# Some vim love
set -sg escape-time 0

# Start numbering at 1 to avoid reaching over to 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Display specific Starship module (e.g., git_branch)
#set -g status-right "#( #(@starship_cmd) git_branch )"

# Combine with other tmux status elements
#set -g status-right "Starship: #( #(@starship_cmd) ) | %H:%M %d-%b-%y"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# if tpm isn't installed, install it!
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'

#https://github.com/tmux-plugins/tmux-sensible/issues/24
# Turn off aggressive-resize AFTER plugins are loaded or tmux-sensible will
# break iterm2 integration
setw -g aggressive-resize off

# catppuccin light/dark theme support
# For a manual installation, this may instead be:
# "$HOME/.config/tmux/plugins/catppuccin/tmux"
set -g @user_catppuccin_dir "$HOME/.tmux/plugins/tmux"

# Shared reload logic, stored as a custom tmux hook.
set-hook -g @user_catppuccin_reload {
    # Clear the previous palette and load default options.
    set -g @catppuccin_reset "true"
    source-file -F "#{@user_catppuccin_dir}/catppuccin_options_tmux.conf"

    # Clear cached colors for the session module.
    # For other modules you display, repeat these five lines with
    # "session" replaced by "directory", "application", "cpu", etc.
    set -ugq @catppuccin_session_color
    set -ugq @catppuccin_status_session_icon_fg
    set -ugq @catppuccin_status_session_icon_bg
    set -ugq @catppuccin_status_session_text_fg
    set -ugq @catppuccin_status_session_text_bg

    # ---- Your Catppuccin customization options go here ----
    set -g status-right "#{E:@catppuccin_status_application}"
    #set -agF status-right "#{E:@catppuccin_status_cpu}"
    #set -agF status-right "#{E:@catppuccin_status_ram}"
    set -ag status-right "#{E:@catppuccin_status_session}"
    #set -ag status-right "#{E:@catppuccin_status_uptime}"
    #set -agF status-right "#{E:@catppuccin_status_battery}"

    # Build the selected theme.
    source-file -F "#{@user_catppuccin_dir}/catppuccin_tmux.conf"

    # ---- Your existing status-bar configuration goes here ----
    # Start with an assignment before appending additional modules.
    set -g status-right-length 100
    set -g status-left-length 100
    set -g status-left ""
}

# React to the terminal's appearance changes.
set-hook -g client-light-theme {
    set -g @catppuccin_flavor "latte"
    set-hook -R @user_catppuccin_reload
}

set-hook -g client-dark-theme {
    set -g @catppuccin_flavor "mocha"
    set-hook -R @user_catppuccin_reload
}

# Apply the current appearance when this configuration is loaded.
# Use dark mode until the terminal reports an appearance.
if-shell -F '#{==:#{client_theme},light}' {
    set-hook -R client-light-theme
} {
    set-hook -R client-dark-theme
}
